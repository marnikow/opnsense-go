---
name: syslog
reconfigureEndpoint: "/syslog/service/reconfigure"
resources:
  - name: Destination
    filename: destination
    monad: destination
    endpoints:
      add: "/syslog/settings/addDestination"
      get: "/syslog/settings/getDestination"
      update: "/syslog/settings/setDestination"
      delete: "/syslog/settings/delDestination"
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Transport
        type: SelectedMap
        key: transport
      - name: Level
        type: SelectedMapList
        key: level
      - name: Facility
        type: SelectedMapList
        key: facility
      - name: Program
        type: SelectedMapList
        key: program
      - name: Hostname
        type: string
        key: hostname
      - name: Certificate
        type: SelectedMap
        key: certificate
      - name: Port
        type: string
        key: port
      - name: Rfc5424
        type: string
        key: rfc5424
      - name: Suppress
        type: string
        key: suppress
      - name: Description
        type: string
        key: description

rpc:
  # General settings (model Syslog general: enabled, loglocal, maxpreserve,
  # maxfilesize). get also returns the destinations, which are ignored here.
  - name: "Settings"
    filename: settings
    customTypes:
      SettingsMonad:
        - name: Syslog
          type: Settings
          key: syslog
      Settings:
        - name: General
          type: General
          key: general
      General:
        - name: Enabled
          type: string
          key: enabled
        - name: LogLocal
          type: string
          key: loglocal
        - name: MaxPreserve
          type: string
          key: maxpreserve
        - name: MaxFileSize
          type: string
          key: maxfilesize
      SettingsResult:
        - name: Result
          type: string
          key: result
      SettingsActionResult:
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "Get"
        method: "GET"
        endpoint: "/syslog/settings/get"
        result_type: "SettingsMonad"
      - name: "Update"
        method: "POST"
        endpoint: "/syslog/settings/set"
        params:
          - name: "syslog"
            optional: false
            bodyParameter: true
            customType: "Settings"
        result_type: "SettingsResult"
      - name: "Reconfigure"
        method: "POST"
        endpoint: "/syslog/service/reconfigure"
        result_type: "SettingsActionResult"
