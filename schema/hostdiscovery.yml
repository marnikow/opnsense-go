---
# Host discovery (Hostwatch), /api/hostdiscovery/*
name: hostdiscovery
rpc:
  - name: "Settings"
    filename: settings
    customTypes:
      SettingsMonad:
        - name: Hostdiscovery
          type: Settings
          key: hostdiscovery
      Settings:
        - name: General
          type: General
          key: general
      General:
        - name: Enabled
          type: string
          key: enabled
        - name: Promiscuous
          type: string
          key: promisc
        - name: Verbose
          type: string
          key: verbose
        - name: SkipNets
          type: SelectedMapList
          key: skip_nets
        - name: Expire4Interval
          type: string
          key: expire4_interval
        - name: Expire6Interval
          type: string
          key: expire6_interval
        - name: Interface
          type: SelectedMapList
          key: interface
      SettingsResult:
        - name: Result
          type: string
          key: result
      SettingsActionResult:
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "Get"
        method: "GET"
        endpoint: "/hostdiscovery/settings/get"
        result_type: "SettingsMonad"
      - name: "Update"
        method: "POST"
        endpoint: "/hostdiscovery/settings/set"
        params:
          - name: "hostdiscovery"
            optional: false
            bodyParameter: true
            customType: "Settings"
        result_type: "SettingsResult"
      - name: "Reconfigure"
        method: "POST"
        endpoint: "/hostdiscovery/service/reconfigure"
        result_type: "SettingsActionResult"
