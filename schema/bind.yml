---
# see https://docs.opnsense.org/development/api/plugins/bind.html
name: bind
reconfigureEndpoint: "/bind/service/reconfigure"
resources:
  - name: Acl
    filename: acl
    monad: acl
    endpoints:
      add: "/bind/acl/add_acl"
      get: "/bind/acl/get_acl"
      update: "/bind/acl/set_acl"
      delete: "/bind/acl/del_acl"
    attrs:
      - name: Name
        type: string
        key: name
      - name: Enabled
        type: string
        key: enabled
      - name: Networks
        type: SelectedMapList
        key: networks

  - name: PrimaryDomain
    filename: primary_domain
    monad: domain
    endpoints:
      add: "/bind/domain/add_primary_domain"
      get: "/bind/domain/get_domain"
      update: "/bind/domain/set_domain"
      delete: "/bind/domain/del_domain"
    attrs:
      - name: DomainName
        type: string
        key: domainname
      - name: Enabled
        type: string
        key: enabled
      - name: Type
        type: SelectedMap
        key: type
      - name: AllowTransfer
        type: SelectedMapList
        key: allowtransfer
      - name: AllowQuery
        type: SelectedMapList
        key: allowquery
      - name: AllowRndcTransfer
        type: string
        key: allowrndctransfer
      - name: AllowRndcUpdate
        type: string
        key: allowrndcupdate
      - name: AllowNotifySecondary
        type: SelectedMapList
        key: allownotifysecondary
      - name: Serial
        type: string
        key: serial
      - name: TimeToLive
        type: string
        key: ttl
      - name: Refresh
        type: string
        key: refresh
      - name: Retry
        type: string
        key: retry
      - name: Expire
        type: string
        key: expire
      - name: Negative
        type: string
        key: negative
      - name: MailAdmin
        type: string
        key: mailadmin
      - name: DnsServer
        type: string
        key: dnsserver

  - name: Record
    filename: record
    monad: record
    endpoints:
      add: "/bind/record/add_record"
      get: "/bind/record/get_record"
      update: "/bind/record/set_record"
      delete: "/bind/record/del_record"
    attrs:
      - name: Domain
        type: SelectedMap
        key: domain
      - name: Enabled
        type: string
        key: enabled
      - name: Name
        type: string
        key: name
      - name: Type
        type: SelectedMap
        key: type
      - name: Value
        type: string
        key: value

rpc:
  # Global settings (os-bind model OPNsense/Bind/General).
  - name: "General"
    filename: general
    customTypes:
      GeneralMonad:
        - name: General
          type: GeneralSettings
          key: general
      GeneralSettings:
        - name: Enabled
          type: string
          key: enabled
        - name: DisableV6
          type: string
          key: disablev6
        - name: EnableRpz
          type: string
          key: enablerpz
        - name: ListenV4
          type: SelectedMapList
          key: listenv4
        - name: ListenV6
          type: SelectedMapList
          key: listenv6
        - name: QuerySource
          type: string
          key: querysource
        - name: QuerySourceV6
          type: string
          key: querysourcev6
        - name: TransferSource
          type: string
          key: transfersource
        - name: TransferSourceV6
          type: string
          key: transfersourcev6
        - name: Port
          type: string
          key: port
        - name: Forwarders
          type: SelectedMapList
          key: forwarders
        - name: FilterAaaaV4
          type: string
          key: filteraaaav4
        - name: FilterAaaaV6
          type: string
          key: filteraaaav6
        - name: FilterAaaaAcl
          type: SelectedMapList
          key: filteraaaaacl
        - name: LogSize
          type: string
          key: logsize
        - name: GeneralLogLevel
          type: SelectedMap
          key: general_log_level
        - name: MaxCacheSize
          type: string
          key: maxcachesize
        - name: Recursion
          type: SelectedMapList
          key: recursion
        - name: AllowTransfer
          type: SelectedMapList
          key: allowtransfer
        - name: AllowQuery
          type: SelectedMapList
          key: allowquery
        - name: DnssecValidation
          type: SelectedMap
          key: dnssecvalidation
        - name: HideHostname
          type: string
          key: hidehostname
        - name: HideVersion
          type: string
          key: hideversion
        - name: DisablePrefetch
          type: string
          key: disableprefetch
        - name: EnableRateLimiting
          type: string
          key: enableratelimiting
        - name: RateLimitCount
          type: string
          key: ratelimitcount
        - name: RateLimitExcept
          type: SelectedMapList
          key: ratelimitexcept
        - name: RndcAlgo
          type: SelectedMap
          key: rndcalgo
        - name: RndcSecret
          type: string
          key: rndcsecret
      GeneralResult:
        - name: Result
          type: string
          key: result
      GeneralActionResult:
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "Get"
        method: "GET"
        endpoint: "/bind/general/get"
        result_type: "GeneralMonad"
      - name: "Update"
        method: "POST"
        endpoint: "/bind/general/set"
        params:
          - name: "general"
            optional: false
            bodyParameter: true
            customType: "GeneralSettings"
        result_type: "GeneralResult"
      - name: "Reconfigure"
        method: "POST"
        endpoint: "/bind/service/reconfigure"
        result_type: "GeneralActionResult"
