---
name: kea
reconfigureEndpoint: "/kea/service/reconfigure"
resources:
  - name: SubnetV4
    filename: subnetv4
    monad: subnet4
    endpoints:
      add: "/kea/dhcpv4/add_subnet"
      get: "/kea/dhcpv4/get_subnet"
      update: "/kea/dhcpv4/set_subnet"
      delete: "/kea/dhcpv4/del_subnet"
    attrs:
      - name: Subnet
        type: string
        key: subnet
      - name: NextServer
        type: string
        key: next_server
      - name: Pools
        type: string
        key: pools
      - name: MatchClientId
        type: string
        key: match-client-id
      - name: OptionDataAutoCollect
        type: string
        key: option_data_autocollect
      - name: OptionData
        type: OptionDataV4
        key: option_data
      - name: Option
        type: SelectedMapList
        key: option
      - name: Allocator
        type: SelectedMap
        key: allocator
      - name: PingCheck
        type: string
        key: ping_check
      - name: DdnsForwardZone
        type: string
        key: ddns_forward_zone
      - name: DdnsReverseZone
        type: string
        key: ddns_reverse_zone
      - name: DdnsQualifyingSuffix
        type: string
        key: ddns_qualifying_suffix
      - name: DdnsDnsServer
        type: string
        key: ddns_dns_server
      - name: DdnsDnsPort
        type: string
        key: ddns_dns_port
      - name: DdnsDomainKeyName
        type: string
        key: ddns_domain_key_name
      - name: DdnsDomainKeySecret
        type: string
        key: ddns_domain_key_secret
      - name: DdnsDomainKeyAlgorithm
        type: SelectedMap
        key: ddns_domain_key_algorithm
      - name: DdnsOverrideNoUpdate
        type: string
        key: ddns_override_no_update
      - name: DdnsOverrideClientUpdate
        type: string
        key: ddns_override_client_update
      - name: DdnsUpdateOnRenew
        type: string
        key: ddns_update_on_renew
      - name: DdnsConflictResolutionMode
        type: SelectedMap
        key: ddns_conflict_resolution_mode
      - name: Interface
        type: SelectedMap
        key: interface
      - name: MatchCode
        type: SelectedMap
        key: match_code
      - name: MatchEncoding
        type: SelectedMap
        key: match_encoding
      - name: MatchData
        type: string
        key: match_data
      - name: SubnetId
        type: string
        key: subnet_id
      - name: ValidLifetime
        type: string
        key: valid_lifetime
      - name: Description
        type: string
        key: description
    customTypes: 
      OptionDataV4:
        - name: DomainNameServers
          type: SelectedMapList
          key: domain_name_servers
        - name: DomainSearch
          type: SelectedMapList
          key: domain_search
        - name: Routers
          type: SelectedMapList
          key: routers
        - name: StaticRoutes
          type: string
          key: static_routes
        - name: DomainName
          type: string
          key: domain_name
        - name: NtpServers
          type: SelectedMapList
          key: ntp_servers
        - name: TimeServers
          type: SelectedMapList
          key: time_servers
        - name: TftpServerName
          type: string
          key: tftp_server_name
        - name: BootFileName
          type: string
          key: boot_file_name
        - name: ClasslessStaticRoute
          type: string
          key: classless_static_route
        - name: V6OnlyPreferred
          type: string
          key: v6_only_preferred
        - name: V4Dnr
          type: string
          key: v4_dnr
  - name: ReservationV4
    filename: reservationv4
    monad: reservation
    endpoints:
      add: "/kea/dhcpv4/add_reservation"
      get: "/kea/dhcpv4/get_reservation"
      update: "/kea/dhcpv4/set_reservation"
      delete: "/kea/dhcpv4/del_reservation"
    attrs:
      - name: Subnet
        type: SelectedMap
        key: subnet
      - name: IpAddress
        type: string
        key: ip_address
      - name: HwAddress
        type: string
        key: hw_address
      - name: Hostname
        type: string
        key: hostname
      - name: ClientId
        type: string
        key: client_id
      - name: NextServer
        type: string
        key: next_server
      - name: OptionData
        type: OptionDataV4
        key: option_data
      - name: Option
        type: SelectedMapList
        key: option
      - name: Description
        type: string
        key: description
  - name: PeerV4
    filename: peerv4
    monad: peer
    endpoints:
      add: "/kea/dhcpv4/add_peer"
      get: "/kea/dhcpv4/get_peer"
      update: "/kea/dhcpv4/set_peer"
      delete: "/kea/dhcpv4/del_peer"
    attrs:
      - name: Name
        type: string
        key: name
      - name: Url
        type: string
        key: url
      - name: Role
        type: SelectedMap
        key: role

  # Custom DHCPv4 options (KeaDhcpv4.xml options.option), referenced by
  # SubnetV4.Option and ReservationV4 by UUID.
  - name: OptionV4
    filename: optionv4
    monad: option
    endpoints:
      add: "/kea/dhcpv4/add_option"
      get: "/kea/dhcpv4/get_option"
      update: "/kea/dhcpv4/set_option"
      delete: "/kea/dhcpv4/del_option"
    attrs:
      - name: Code
        type: SelectedMap
        key: code
      - name: Encoding
        type: SelectedMap
        key: encoding
      - name: Data
        type: string
        key: data
      - name: Force
        type: string
        key: force
      - name: MatchCode
        type: SelectedMap
        key: match_code
      - name: MatchEncoding
        type: SelectedMap
        key: match_encoding
      - name: MatchData
        type: string
        key: match_data
      - name: Description
        type: string
        key: description

  # Custom DHCPv6 options (KeaDhcpv6.xml options.option), referenced by
  # SubnetV6.Option by UUID.
  - name: OptionV6
    filename: optionv6
    monad: option
    endpoints:
      add: "/kea/dhcpv6/add_option"
      get: "/kea/dhcpv6/get_option"
      update: "/kea/dhcpv6/set_option"
      delete: "/kea/dhcpv6/del_option"
    attrs:
      - name: Code
        type: SelectedMap
        key: code
      - name: Encoding
        type: SelectedMap
        key: encoding
      - name: Data
        type: string
        key: data
      - name: Force
        type: string
        key: force
      - name: MatchCode
        type: SelectedMap
        key: match_code
      - name: MatchEncoding
        type: SelectedMap
        key: match_encoding
      - name: MatchData
        type: string
        key: match_data
      - name: Description
        type: string
        key: description

  - name: SubnetV6
    filename: subnetv6
    monad: subnet6
    endpoints:
      add: "/kea/dhcpv6/add_subnet"
      get: "/kea/dhcpv6/get_subnet"
      update: "/kea/dhcpv6/set_subnet"
      delete: "/kea/dhcpv6/del_subnet"
    attrs:
      - name: Subnet
        type: string
        key: subnet
      - name: Allocator
        type: SelectedMap
        key: allocator
      - name: PDAllocator
        type: SelectedMap
        key: pd-allocator
      - name: Pools
        type: string
        key: pools
      - name: Interface
        type: SelectedMap
        key: interface
      - name: OptionData
        type: OptionDataV6
        key: option_data
      - name: DynamicPrefix
        type: string
        key: dynamic_prefix
      - name: OptionDataAutoCollect
        type: string
        key: option_data_autocollect
      - name: SubnetId
        type: string
        key: subnet_id
      - name: ValidLifetime
        type: string
        key: valid_lifetime
      - name: Option
        type: SelectedMapList
        key: option
      - name: DdnsForwardZone
        type: string
        key: ddns_forward_zone
      - name: DdnsReverseZone
        type: string
        key: ddns_reverse_zone
      - name: DdnsQualifyingSuffix
        type: string
        key: ddns_qualifying_suffix
      - name: DdnsDnsServer
        type: string
        key: ddns_dns_server
      - name: DdnsDnsPort
        type: string
        key: ddns_dns_port
      - name: DdnsDomainKeyName
        type: string
        key: ddns_domain_key_name
      - name: DdnsDomainKeySecret
        type: string
        key: ddns_domain_key_secret
      - name: DdnsDomainKeyAlgorithm
        type: SelectedMap
        key: ddns_domain_key_algorithm
      - name: DdnsOverrideNoUpdate
        type: string
        key: ddns_override_no_update
      - name: DdnsOverrideClientUpdate
        type: string
        key: ddns_override_client_update
      - name: DdnsUpdateOnRenew
        type: string
        key: ddns_update_on_renew
      - name: DdnsConflictResolutionMode
        type: SelectedMap
        key: ddns_conflict_resolution_mode
      - name: Description
        type: string
        key: description
    customTypes:
      OptionDataV6:
        - name: DomainNameServers
          type: SelectedMapList
          key: dns_servers
        - name: DomainSearch
          type: SelectedMapList
          key: domain_search
        - name: V6Dnr
          type: string
          key: v6_dnr
  - name: ReservationV6
    filename: reservationv6
    monad: reservation
    endpoints:
      add: "/kea/dhcpv6/add_reservation"
      get: "/kea/dhcpv6/get_reservation"
      update: "/kea/dhcpv6/set_reservation"
      delete: "/kea/dhcpv6/del_reservation"
    attrs:
      - name: Subnet
        type: SelectedMap
        key: subnet
      - name: IpAddress
        type: string
        key: ip_address
      - name: DUID
        type: string
        key: duid
      - name: Hostname
        type: string
        key: hostname
      - name: DomainSearch
        type: SelectedMapList
        key: domain_search
      - name: Prefix
        type: string
        key: prefix
      - name: HwAddress
        type: string
        key: hw_address
      - name: Option
        type: SelectedMapList
        key: option
      - name: Description
        type: string
        key: description
  - name: PeerV6
    filename: peerv6
    monad: peer
    endpoints:
      add: "/kea/dhcpv6/add_peer"
      get: "/kea/dhcpv6/get_peer"
      update: "/kea/dhcpv6/set_peer"
      delete: "/kea/dhcpv6/del_peer"
    attrs:
      - name: Name
        type: string
        key: name
      - name: Url
        type: string
        key: url
      - name: Role
        type: SelectedMap
        key: role
  - name: PDPool
    filename: pd_pool
    monad: pd_pool
    endpoints:
      add: "/kea/dhcpv6/add_pd_pool"
      get: "/kea/dhcpv6/get_pd_pool"
      update: "/kea/dhcpv6/set_pd_pool"
      delete: "/kea/dhcpv6/del_pd_pool"
    attrs:
      - name: Subnet
        type: SelectedMap
        key: subnet
      - name: Prefix
        type: string
        key: prefix
      - name: PrefixLen
        type: string
        key: prefix_len
      - name: DelegatedLen
        type: string
        key: delegated_len
      - name: Description
        type: string
        key: description

rpc:
  - name: "Settings"
    filename: settings
    customTypes:
      DHCPv4Monad:
        - name: DHCPv4
          type: DHCPv4Settings
          key: dhcpv4
      DHCPv4Settings:
        - name: General
          type: DHCPv4General
          key: general
        - name: LeaseExpire
          type: LeaseExpire
          key: lexpire
        - name: HA
          type: HA
          key: ha
        - name: ThisHostname
          type: string
          key: this_hostname
      DHCPv4General:
        - name: Enabled
          type: string
          key: enabled
        - name: ManualConfig
          type: string
          key: manual_config
        - name: Interfaces
          type: SelectedMapList
          key: interfaces
        - name: ServiceSocketsMaxRetries
          type: string
          key: service_sockets_max_retries
        - name: ServiceSocketsRetryWaitTime
          type: string
          key: service_sockets_retry_wait_time
        - name: ValidLifetime
          type: string
          key: valid_lifetime
        - name: DeclineProbationPeriod
          type: string
          key: decline_probation_period
        - name: FWRules
          type: string
          key: fwrules
        - name: DHCPSocketType
          type: SelectedMap
          key: dhcp_socket_type
        - name: Compatibility
          type: SelectedMapList
          key: compatibility
      DHCPv6Monad:
        - name: DHCPv6
          type: DHCPv6Settings
          key: dhcpv6
      DHCPv6Settings:
        - name: General
          type: DHCPv6General
          key: general
        - name: LeaseExpire
          type: LeaseExpire
          key: lexpire
        - name: HA
          type: HA
          key: ha
        - name: ThisHostname
          type: string
          key: this_hostname
      DHCPv6General:
        - name: Enabled
          type: string
          key: enabled
        - name: ManualConfig
          type: string
          key: manual_config
        - name: Interfaces
          type: SelectedMapList
          key: interfaces
        - name: ServiceSocketsMaxRetries
          type: string
          key: service_sockets_max_retries
        - name: ServiceSocketsRetryWaitTime
          type: string
          key: service_sockets_retry_wait_time
        - name: ValidLifetime
          type: string
          key: valid_lifetime
        - name: DeclineProbationPeriod
          type: string
          key: decline_probation_period
        - name: MacSources
          type: SelectedMapList
          key: mac_sources
        - name: FWRules
          type: string
          key: fwrules
      LeaseExpire:
        - name: HoldReclaimedTime
          type: string
          key: hold_reclaimed_time
        - name: ReclaimTimerWaitTime
          type: string
          key: reclaim_timer_wait_time
        - name: FlushReclaimedTimerWaitTime
          type: string
          key: flush_reclaimed_timer_wait_time
        - name: MaxReclaimTime
          type: string
          key: max_reclaim_time
        - name: MaxReclaimLeases
          type: string
          key: max_reclaim_leases
        - name: UnwarnedReclaimCycles
          type: string
          key: unwarned_reclaim_cycles
      HA:
        - name: Enabled
          type: string
          key: enabled
        - name: ThisServerName
          type: string
          key: this_server_name
        - name: MaxUnackedClients
          type: string
          key: max_unacked_clients
      DdnsMonad:
        - name: Ddns
          type: DdnsSettings
          key: ddns
      DdnsSettings:
        - name: General
          type: DdnsGeneral
          key: general
      DdnsGeneral:
        - name: Enabled
          type: string
          key: enabled
        - name: ManualConfig
          type: string
          key: manual_config
        - name: ServerIp
          type: string
          key: server_ip
        - name: ServerPort
          type: string
          key: server_port
      Result:
        - name: Result
          type: string
          key: result
      ActionResult:
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "DHCPv4Get"
        method: "GET"
        endpoint: "/kea/dhcpv4/get"
        result_type: "DHCPv4Monad"
      - name: "DHCPv4Update"
        method: "POST"
        endpoint: "/kea/dhcpv4/set"
        params:
          - name: "dhcpv4"
            optional: false
            bodyParameter: true
            customType: "DHCPv4Settings"
        result_type: "Result"
      - name: "DHCPv6Get"
        method: "GET"
        endpoint: "/kea/dhcpv6/get"
        result_type: "DHCPv6Monad"
      - name: "DHCPv6Update"
        method: "POST"
        endpoint: "/kea/dhcpv6/set"
        params:
          - name: "dhcpv6"
            optional: false
            bodyParameter: true
            customType: "DHCPv6Settings"
        result_type: "Result"
      - name: "DdnsGet"
        method: "GET"
        endpoint: "/kea/ddns/get"
        result_type: "DdnsMonad"
      - name: "DdnsUpdate"
        method: "POST"
        endpoint: "/kea/ddns/set"
        params:
          - name: "ddns"
            optional: false
            bodyParameter: true
            customType: "DdnsSettings"
        result_type: "Result"
      - name: "Reconfigure"
        method: "POST"
        endpoint: "/kea/service/reconfigure"
        result_type: "ActionResult"
