---
# Routing module (System > Gateways), /api/routing/*
name: routing
reconfigureEndpoint: "/routing/settings/reconfigure"
resources:
  - name: Gateway
    filename: gateway
    monad: gateway_item
    endpoints:
      add: "/routing/settings/add_gateway"
      get: "/routing/settings/get_gateway"
      update: "/routing/settings/set_gateway"
      delete: "/routing/settings/del_gateway"
    attrs:
      - name: Disabled
        type: string
        key: disabled
      - name: Name
        type: string
        key: name
      - name: Description
        type: string
        key: descr
      - name: Interface
        type: SelectedMap
        key: interface
      - name: IpProtocol
        type: SelectedMap
        key: ipprotocol
      - name: Gateway
        type: string
        key: gateway
      - name: DefaultGateway
        type: string
        key: defaultgw
      - name: FarGateway
        type: string
        key: fargw
      - name: MonitorDisable
        type: string
        key: monitor_disable
      - name: MonitorNoRoute
        type: string
        key: monitor_noroute
      - name: MonitorKillStates
        type: string
        key: monitor_killstates
      - name: MonitorKillStatesPriority
        type: string
        key: monitor_killstates_priority
      - name: Monitor
        type: string
        key: monitor
      - name: ForceDown
        type: string
        key: force_down
      - name: NoSync
        type: string
        key: nosync
      - name: Priority
        type: string
        key: priority
      - name: Weight
        type: string
        key: weight
      - name: LatencyLow
        type: string
        key: latencylow
      - name: LatencyHigh
        type: string
        key: latencyhigh
      - name: LossLow
        type: string
        key: losslow
      - name: LossHigh
        type: string
        key: losshigh
      - name: Interval
        type: string
        key: interval
      - name: TimePeriod
        type: string
        key: time_period
      - name: LossInterval
        type: string
        key: loss_interval
      - name: DataLength
        type: string
        key: data_length

rpc:
  - name: "Gateways"
    filename: gateways
    customTypes:
      GatewaySearchResponse:
        - name: Rows
          type: '[]GatewaySearchRow'
          key: rows
      # get_gateway only lists enabled interfaces as options, so a gateway on a
      # disabled interface reads back with an empty interface. The search rows
      # carry the stored interface identifier.
      GatewaySearchRow:
        - name: Uuid
          type: string
          key: uuid
        - name: Name
          type: string
          key: name
        - name: Interface
          type: string
          key: interface
    rpc_calls:
      - name: "Search"
        method: "GET"
        endpoint: "/routing/settings/search_gateway"
        result_type: "GatewaySearchResponse"
